<aside class="sidebar">
    <header class="sidebar-header">
        <div class="logo-sigil"></div>
        <div class="wiki-name">CODEX MYSTARIA</div>
        <button
            type="button"
            class="menu-toggle"
            [class.open]="isNavigationOpen"
            [attr.aria-expanded]="isNavigationOpen"
            aria-controls="sidebar-panel"
            aria-label="Ouvrir ou fermer la navigation"
            (click)="toggleNavigation()"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <div id="sidebar-panel" class="sidebar-panel" [class.open]="isNavigationOpen">
        <hr class="separator">

        <div class="nav-search" role="search">
            <label for="codex-nav-search">Recherche</label>
            <div class="nav-search-field">
                <input
                    id="codex-nav-search"
                    type="search"
                    placeholder="Chercher dans l'index..."
                    [value]="searchQuery"
                    (input)="updateSearch($event)"
                >
                <button
                    *ngIf="searchQuery"
                    type="button"
                    aria-label="Effacer la recherche"
                    (click)="clearSearch()"
                >x</button>
            </div>
            <div *ngIf="searchResults.length > 0" class="search-results" aria-label="Resultats de recherche">
                <a
                    *ngFor="let result of searchResults"
                    [routerLink]="result.path"
                    [fragment]="result.fragment"
                    (click)="closeNavigation()"
                >{{ result.label }}</a>
            </div>
        </div>

        <hr class="separator">

        <nav class="main-navigation" aria-label="Sections principales">
            <ul>
                <li
                    *ngFor="let item of navItems"
                    class="nav-item"
                    [class.nav-group]="item.children"
                    [class.current]="expandedGroup === item.key"
                    [class.expanded]="isGroupOpen(item.key)"
                    (mouseenter)="item.children && openGroup(item.key)"
                >
                    <button
                        *ngIf="item.children; else simpleLink"
                        type="button"
                        class="main-link group-link"
                        [attr.aria-expanded]="isGroupOpen(item.key)"
                        [routerLink]="item.path"
                        (click)="toggleGroup(item.key)"
                    >{{ item.label }}</button>
                    <ng-template #simpleLink>
                        <a
                            class="main-link"
                            [routerLink]="item.path"
                            [fragment]="item.fragment"
                            (click)="closeNavigation()"
                        >{{ item.label }}</a>
                    </ng-template>
                    <ul *ngIf="item.children" class="sub-navigation">
                        <li *ngFor="let child of item.children">
                            <a
                                [routerLink]="child.path"
                                [fragment]="child.fragment"
                                (click)="closeNavigation()"
                            >{{ child.label }}</a>
                        </li>
                    </ul>
                </li>
            </ul>
        </nav>

        <hr class="separator">
        <section class="animation-settings" aria-label="Preferences d'animation">
            <span>Ecriture magique</span>
            <button
                type="button"
                class="toggle-button"
                [class.enabled]="magicWritingEnabled()"
                [attr.aria-pressed]="magicWritingEnabled()"
                (click)="toggleMagicWriting()"
            >
                <span class="toggle-track" aria-hidden="true">
                    <span class="toggle-thumb"></span>
                </span>
                <span class="toggle-label">{{ magicWritingEnabled() ? 'Activee' : 'Desactivee' }}</span>
            </button>
        </section>

        <hr class="separator">
        <section class="citation-lore">
            <blockquote>
                "Dans les ombres des anciens grimoires, la verite se revele a ceux qui osent chercher."
            </blockquote>
        </section>
        <hr class="separator">
    </div>
</aside>
